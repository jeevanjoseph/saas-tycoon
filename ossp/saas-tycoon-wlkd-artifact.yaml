dependencies: []
body:
  resource:
    type: helm
    url: https://artifactory-phx-prod.cdaas.oraclecloud.com/artifactory/generic-spectra-platform-dev-local/ossp/ossp-demo-apps/saas-tycoon/saas-tycoon-0.1.0.tgz
  namedRoutes:
    - name: saas-tycoon-frontend
      rules:
        - matches:
          - '(pathPrefix matches "/")'
          backend:
            serviceName: saas-tycoon-client
            servicePort: 80
    - name: saas-tycoon-backend
      rules:
        - matches:
          - '(pathPrefix matches "/api/game")'
          backend:
            serviceName: saas-tycoon-server
            servicePort: 3000
  lifecycleHooks:
    - name: demo-precreate
      phase: preCreate
      jobConfig:
        image: docker-master.cdaas.oraclecloud.com/docker-spectra-platform-dev/ossp-demo-apps/ossp/kubectl-oraclelinux:simple-hellospectra-lifecyclehook
        ignoreFailures: true
        command: echo
        args:
        - preCreate
    - name: demo-postcreate-1
      phase: postCreate
      jobConfig:
        image: docker-master.cdaas.oraclecloud.com/docker-spectra-platform-dev/ossp-demo-apps/ossp/kubectl-oraclelinux:simple-hellospectra-lifecyclehook
        ignoreFailures: true
        command: bash
        args:
          - "-c"
          - |
            NAMESPACE=$(cat /ossp/jobs/input.json | jq -r '.workloadDeploymentName')
            echo "Updating ConfigMap postCreateStatus in namespace $NAMESPACE"
            kubectl patch configmap lifecycle-status \
              -n "$NAMESPACE" \
              --type strategic \
              -p '{"data": {"postCreateStatus": "Success"}}'
    - name: demo-postcreate-2
      phase: postCreate
      jobConfig:
        image: docker-master.cdaas.oraclecloud.com/docker-spectra-platform-dev/ossp-demo-apps/ossp/kubectl-oraclelinux:simple-hellospectra-lifecyclehook
        ignoreFailures: true
        command: echo
        args:
        - postCreate-2
    - name: demo-postcreate-3
      phase: postCreate
      jobConfig:
        image: docker-master.cdaas.oraclecloud.com/docker-spectra-platform-dev/ossp-demo-apps/ossp/kubectl-oraclelinux:simple-hellospectra-lifecyclehook
        ignoreFailures: true
        command: echo
        args:
        - postCreate-3
    - name: demo-preupdate
      phase: preUpdate
      jobConfig:
        image: docker-master.cdaas.oraclecloud.com/docker-spectra-platform-dev/ossp-demo-apps/ossp/kubectl-oraclelinux:simple-hellospectra-lifecyclehook
        ignoreFailures: true
        command: echo
        args:
        - preUpdate
    - name: demo-postupdate
      phase: postUpdate
      jobConfig:
        image: docker-master.cdaas.oraclecloud.com/docker-spectra-platform-dev/ossp-demo-apps/ossp/kubectl-oraclelinux:simple-hellospectra-lifecyclehook
        ignoreFailures: true
        command: echo
        args:
        - postUpdate
    - name: demo-prestop
      phase: preStop
      jobConfig:
        image: docker-master.cdaas.oraclecloud.com/docker-spectra-platform-dev/ossp-demo-apps/ossp/kubectl-oraclelinux:simple-hellospectra-lifecyclehook
        ignoreFailures: true
        command: echo
        args:
        - preStop
    - name: demo-poststop
      phase: postStop
      jobConfig:
        image: docker-master.cdaas.oraclecloud.com/docker-spectra-platform-dev/ossp-demo-apps/ossp/kubectl-oraclelinux:simple-hellospectra-lifecyclehook
        ignoreFailures: true
        command: echo
        args:
        - postStop
    - name: demo-prestart
      phase: preStart
      jobConfig:
        image: docker-master.cdaas.oraclecloud.com/docker-spectra-platform-dev/ossp-demo-apps/ossp/kubectl-oraclelinux:simple-hellospectra-lifecyclehook
        ignoreFailures: true
        command: echo
        args:
        - preStart
    - name: demo-poststart
      phase: postStart
      jobConfig:
        image: docker-master.cdaas.oraclecloud.com/docker-spectra-platform-dev/ossp-demo-apps/ossp/kubectl-oraclelinux:simple-hellospectra-lifecyclehook
        ignoreFailures: true
        command: echo
        args:
        - postStart
    - name: demo-predelete
      phase: preDelete
      jobConfig:
        image: docker-master.cdaas.oraclecloud.com/docker-spectra-platform-dev/ossp-demo-apps/ossp/kubectl-oraclelinux:simple-hellospectra-lifecyclehook
        ignoreFailures: true
        command: echo
        args:
        - preDelete
    - name: demo-postdelete
      phase: postDelete
      jobConfig:
        image: docker-master.cdaas.oraclecloud.com/docker-spectra-platform-dev/ossp-demo-apps/ossp/kubectl-oraclelinux:simple-hellospectra-lifecyclehook
        ignoreFailures: true
        command: echo
        args:
        - postDelete
published: true
propertiesSchema:
  type: object
  properties:
    frontend-port:
      default: 80
      description: The port to run the Saas Tycoon frontend on
      type: integer
    frontend-replicas:
      default: 2
      description: The number of replicas for the SaaS tycoon frontend
      type: integer
    backend-port:
      default: 3000
      description: The port to run the Saas Tycoon backend on
      type: integer
    backend-replicas:
      default: 3
      description: The number of replicas for the SaaS tycoon backend
      type: integer
  


